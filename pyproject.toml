[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "noos-jupyter-authenticator"
version = "0.3.1"
description = "JupyterHub authenticator for the Noos platform."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Noos Energy", email = "contact@noos.energy" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "jupyterhub>=3.0.0",
    "noos-pyk",
    "tornado>=6.0.0",
    "traitlets>=5.0.0",
]

[dependency-groups]
dev = [
    # Linter
    "ruff>=0.9.3",
    "mypy>=1.0.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-mock>=3.0.0",
    "pytest-asyncio>=1.2.0",
    # Debugging
    "ipdb>=0.13.0",
    "ipython>=8.0.0",
]

[tool.ruff]
line-length = 99
src = ["src"]

[tool.ruff.lint]
ignore = [
    # Pydocstyle
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # Incompatible rules with D211 & D212
    "D203", "D213",
]
select = [
    # Flake8
    "F", "C90",
    # Flake8-print & Flake8-debugger
    "T10", "T20",
    # Pycodestyle
    "E", "W",
    # Pydocstyle
    "D",
    # Isort
    "I",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
default-section = "third-party"
known-first-party = ["noos_pyk", "noos_jupyter_authenticator", "tests"]
section-order = ["standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
install_types = true
non_interactive = true
incremental = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test"
python_functions = "test_*"
pythonpath = ["src"]
junit_family = "xunit2"
addopts = "--junitxml=.pytest_results/junit.xml"
